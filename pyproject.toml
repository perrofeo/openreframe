[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openreframe"
version = "0.1.0"
description = "Reframe a finished edit to another aspect ratio, shot by shot (16:9 to 9:16, 4:5, 1:1, or vertical to 16:9), with open models on ComfyUI."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
  "comfy-sdk>=0.4,<0.5",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
web = ["gradio>=5,<6"]

[project.scripts]
openreframe = "openreframe.cli:main"
openreframe-web = "openreframe.web:main"

[tool.setuptools]
packages = ["openreframe"]

[tool.setuptools.package-data]
openreframe = ["workflows/*.json"]
